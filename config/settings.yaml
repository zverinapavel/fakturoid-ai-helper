# Fakturoid Invoice Processor Configuration

# Processing Settings
processing:
  mode: "manual"  # Options: auto, manual, both
  auto_submit: false
  batch_size: 10
  
# Directories
directories:
  invoices: "/Users/pavelzverina/Documents/!MojeDokumenty/Ucetnictvi/BF faktury prijate/to_fakturoid"
  processed: "/Users/pavelzverina/Documents/!MojeDokumenty/Ucetnictvi/BF faktury prijate/processed"
  # invoices: "data/invoices"
  # processed: "data/processed"
  
# AI Model Configuration
ai:
  provider: "anthropic"  # Options: anthropic, openai, deepseek, groq, ollama
  # model: "claude-3-5-sonnet-20241022"  # Deprecated
  model: "claude-sonnet-4-5-20250929"
  temperature: 0.0
  max_tokens: 4096
  
  # Ollama settings (for local models)
  ollama_base_url: "http://localhost:11434"
  
# Model examples for different providers:
# - anthropic: claude-sonnet-4-5-20250929, claude-opus-4-5-20250929, claude-3-5-sonnet-20241022 (deprecated)
# - openai: gpt-4o, gpt-4-turbo, gpt-4o-mini
# - deepseek: deepseek-chat
# - groq: llama-3.2-90b-vision-preview, llama-3.2-11b-vision-preview
# - ollama: llama3.2-vision, llava (requires local Ollama server)
  
# Fakturoid API
fakturoid:
  base_url: "https://app.fakturoid.cz/api/v3"
  timeout: 30
  
# Invoice Extraction Schema
extraction:
  required_fields:
    - invoice_number
    - issue_date
    - supplier_name
    - total_amount
  optional_fields:
    - due_date
    - variable_symbol
    - supplier_address
    - supplier_ico
    - supplier_dic
    - line_items
    - tax_amount
    - currency
    
# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/processor.log"

